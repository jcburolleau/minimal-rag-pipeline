amendments:
  - id: AMD-2025-01
    amends: C-2024-RS
    title: Amendment 1 to Rhine Silicon supply agreement
    signed: "2025-04-18"
    effective: "2025-04-20"
    summary: >
      Changes the standard lead time for part RS-HUM-7 from 45 days to 70 days
      because of a process move at the Dresden fab. Piece price remains
      EUR 18.40. All other terms of C-2024-RS stay in force.
    changes:
      - field: lead_time_days
        from: 45
        to: 70
      - field: unit_price_eur
        from: 18.40
        to: 18.40
    impact: >
      Finished NL-SP-90 probes inherit the 70-day lead time. Northline did not
      raise the CHF 890 list price of the probe. Safety stock of RS-HUM-7 was
      increased from four weeks to eight weeks.
